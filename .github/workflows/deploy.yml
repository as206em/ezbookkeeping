name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Update the Portainer stack after publishing the image
        required: true
        type: boolean
        default: true

env:
  IMAGE: ghcr.io/as206em/ezbookkeeping
  IMAGE_TAG: sha-${{ github.sha }}

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=ezbookkeeping
          cache-to: type=gha,mode=max,scope=ezbookkeeping

  deploy:
    needs: build-and-publish
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Pin Portainer stack to the published image
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard FETCH_HEAD
          sed -i "s|image: ${IMAGE}:[^[:space:]]*|image: ${IMAGE}:${IMAGE_TAG}|" deploy/portainer.yaml

          if ! git diff --quiet -- deploy/portainer.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add deploy/portainer.yaml
            git commit -m "deploy: update ezbookkeeping image to ${IMAGE_TAG}"
            git push origin HEAD:main
          fi

      - name: Update Portainer stack
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: curl --fail-with-body --silent --show-error --request POST "$PORTAINER_WEBHOOK"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 5 https://fi.asem-mkl.com/healthz.json >/dev/null; then
              echo "ezBookkeeping is healthy."
              exit 0
            fi

            echo "ezBookkeeping is not ready yet (attempt ${attempt}/15)."
            if (( attempt < 15 )); then
              sleep 4
            fi
          done

          echo "::error::ezBookkeeping did not become healthy at https://fi.asem-mkl.com/healthz.json"
          exit 1
